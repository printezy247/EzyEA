    <text x="130" y="125" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI" font-size="10">EzyMap_V2_0_ZONE_QUALITY.mq5<br/>EzyMap_V2_1a_SESSION_VOL.mq5</text>
    <text x="130" y="155" text-anchor="middle" fill="#ff6b6b" font-family="Segoe UI" font-weight="600" font-size="9">5-stage pipeline • Session logic</text>
