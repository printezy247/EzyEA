    <text x="130" y="105" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI" font-weight="700" font-size="14">V1 Foundation</text>
    <text x="130" y="125" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI" font-size="10">EzyEA_V1_XAUUSD.mq5<br/>EzyEA_V1.1_XAUUSD.mq5</text>
    <text x="130" y="155" text-anchor="middle" fill="#ffd700" font-family="Segoe UI" font-weight="600" font-size="9">Core logic • Gold focus</text>
  </g>

