<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="promiseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="cardGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect x="20" y="20" width="760" height="160" rx="24" fill="#0a0e1a" stroke="url(#promiseGrad)" stroke-width="2" filter="url(#cardGlow)" opacity="0.9"/>
  <rect x="20" y="20" width="760" height="4" rx="2" fill="url(#promiseGrad)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <text x="400" y="70" text-anchor="middle" fill="url(#promiseGrad)" font-family="Segoe UI, system-ui, sans-serif" font-weight="800" font-size="28" filter="url(#textGlow)">⚡ MULTI-VERSION EA · XAUUSD/BTCUSD · PROP-FIRM READY</text>
  
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#e2e8f0">
    <text x="80" y="115" text-anchor="middle" font-weight="600">📈 7+ EA Versions</text>
    <text x="80" y="130" text-anchor="middle" fill="#94a3b8" font-size="9">V1–V4 + variants</text>
    
    <text x="240" y="115" text-anchor="middle" font-weight="600">🥇 Gold & BTC</text>
    <text x="240" y="130" text-anchor="middle" fill="#94a3b8" font-size="9">XAUUSD / BTCUSD</text>
    
    <text x="400" y="115" text-anchor="middle" font-weight="600">🎯 Zone Quality</text>
    <text x="400" y="130" text-anchor="middle" fill="#94a3b8" font-size="9">Volume + session logic</text>
    
    <text x="560" y="115" text-anchor="middle" font-weight="600">🛡️ Risk Managed</text>
    <text x="560" y="130" text-anchor="middle" fill="#94a3b8" font-size="9">Fixed exit / trail SL</text>
    
    <text x="720" y="115" text-anchor="middle" font-weight="600">📊 Ready Sets</text>
    <text x="720" y="130" text-anchor="middle" fill="#94a3b8" font-size="9">Optimized .set files</text>
  </g>
  
  <circle cx="400" cy="35" r="5" fill="#00ffa3">
    <animate attributeName="r" values="5;9;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="48" text-anchor="middle" fill="#00ffa3" font-family="Segoe UI" font-weight="700" font-size="9">LIVE</text>
</svg>